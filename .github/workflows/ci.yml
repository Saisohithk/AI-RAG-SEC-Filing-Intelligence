name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv venv .venv
      - run: uv pip install ruff mypy --python .venv/bin/python
      - run: .venv/bin/ruff check src/ tests/
      - run: .venv/bin/ruff format --check src/ tests/
      - run: .venv/bin/mypy src/ --ignore-missing-imports --no-error-summary

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt --python .venv/bin/python

      - name: Run unit + integration tests
        run: .venv/bin/pytest tests/unit/ tests/integration/ -v --cov=src --cov-config=.coveragerc --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  all-checks-pass:
    name: All Checks Pass
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed"
