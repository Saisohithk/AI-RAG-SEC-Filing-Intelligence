apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-rag-ui
  labels:
    app: sec-rag-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sec-rag-ui
  template:
    metadata:
      labels:
        app: sec-rag-ui
    spec:
      containers:
        - name: ui
          image: sec-rag-ui:latest
          ports:
            - containerPort: 8501
          env:
            - name: API_BASE_URL
              value: "http://sec-rag-api"
          envFrom:
            - secretRef:
                name: sec-rag-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sec-rag-ui
spec:
  selector:
    app: sec-rag-ui
  ports:
    - port: 80
      targetPort: 8501
  type: LoadBalancer
