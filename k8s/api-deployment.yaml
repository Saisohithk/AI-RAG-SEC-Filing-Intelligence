apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-rag-api
  labels:
    app: sec-rag-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sec-rag-api
  template:
    metadata:
      labels:
        app: sec-rag-api
    spec:
      containers:
        - name: api
          image: sec-rag-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: sec-rag-secrets
            - configMapRef:
                name: sec-rag-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: bm25-index
              mountPath: /app/data
      volumes:
        - name: bm25-index
          persistentVolumeClaim:
            claimName: bm25-index-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sec-rag-api
spec:
  selector:
    app: sec-rag-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sec-rag-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sec-rag-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
